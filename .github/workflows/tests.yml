name: tests

on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hub/requirements-dev.txt
            backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hub/requirements-dev.txt -r backend/requirements.txt
      - name: Hub tests
        run: python -m pytest hub/tests -v
      - name: Backend tests
        run: python -m pytest backend/tests -v
      - name: Web panel tests
        run: python -m pytest web/tests -v
