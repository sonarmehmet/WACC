name: tests

on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hub/requirements-dev.txt
            backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hub/requirements-dev.txt -r backend/requirements.txt
      - name: Hub tests
        run: python -m pytest hub/tests -v
      - name: Backend tests
        run: python -m pytest backend/tests -v
      - name: Web panel tests
        run: python -m pytest web/tests -v

  windows-e2e:
    # Runs the real start_wacc.bat on Windows and then the smoke test against the live services.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose batch files (line endings and venv)
        shell: cmd
        run: |
          python -c "import pathlib; [print(f.name, 'CRLF' if b'\r\n' in f.read_bytes() else 'LF-only') for f in pathlib.Path('.').glob('*.bat')]"
          python -m venv diag_venv
          echo venv exit code: %errorlevel%
          diag_venv\Scripts\python.exe --version
      - name: Trace the first half of start_wacc.bat (echo on)
        shell: powershell
        continue-on-error: true
        run: |
          $lines = Get-Content start_wacc.bat
          $cut = ($lines | Select-String 'Backend ayri pencerede').LineNumber - 1
          $lines[0..($cut-1)] | ForEach-Object { $_ -replace '^@echo off','@echo on' } | Set-Content -Encoding ASCII trace.bat
          cmd.exe /c trace.bat 2>&1
          Write-Host "trace exit code: $LASTEXITCODE"
      - name: Start WACC with start_wacc.bat
        shell: powershell
        run: |
          Start-Process -FilePath cmd.exe -ArgumentList "/c","start_wacc.bat" -RedirectStandardOutput start.out.log -RedirectStandardError start.err.log -WindowStyle Hidden
      - name: Wait for hub, backend and panel
        shell: powershell
        run: |
          $urls = "http://127.0.0.1:8765/health","http://127.0.0.1:8800/health","http://127.0.0.1:8780/api/health"
          $deadline = (Get-Date).AddSeconds(150)
          $ready = $false
          while ((Get-Date) -lt $deadline -and -not $ready) {
            Start-Sleep -Seconds 3
            $ready = $true
            foreach ($u in $urls) {
              try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 3; if ($r.StatusCode -ne 200) { $ready = $false } } catch { $ready = $false }
            }
          }
          Write-Host "ready=$ready"
          if (-not $ready) {
            Write-Host "--- start.out.log"; Get-Content start.out.log -ErrorAction SilentlyContinue
            Write-Host "--- start.err.log"; Get-Content start.err.log -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -like "python*" } | Format-Table Id,ProcessName,StartTime
            exit 1
          }
      - name: Smoke test
        run: python -X utf8 scripts/smoke_test.py
      - name: Show start log on failure
        if: failure()
        shell: powershell
        run: |
          Get-Content start.out.log -ErrorAction SilentlyContinue
          Get-Content start.err.log -ErrorAction SilentlyContinue
