name: security-nightly

# Runs by itself every day (and on demand): no person or AI session has to start it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: ["task/nightly-security"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install bandit pip-audit pytest
      - name: Secrets in the repository
        run: python scripts/scan_secrets.py
      - name: Attack regression tests (policy bypasses found in earlier reviews must stay closed)
        run: python -m pytest -q backend/tests/test_policy_attacks.py backend/tests/test_execution.py backend/tests/test_scan_secrets.py
      - name: Static analysis (bandit, medium and higher)
        run: python -m bandit -r hub/wacc_hub backend/wacc_backend web/serve.py desktop/wacc_desktop launcher -ll -q
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r hub/requirements.txt -r backend/requirements.txt
